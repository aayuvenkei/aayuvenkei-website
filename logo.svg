<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="darkAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1520" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#050a10" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020407" stop-opacity="1" />
    </radialGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Cyber Teal Gradient -->
    <linearGradient id="cyberTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Golden Blue Dual Gradient -->
    <linearGradient id="goldToTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#darkAura)" />
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="url(#cyberTeal)" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Ambient Glowing Behind Emblem -->
  <circle cx="256" cy="256" r="140" fill="#00d2ff" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="90" fill="#fbbf24" opacity="0.15" filter="url(#softGlow)" />

  <!-- Outer Cyber Orbit Rings -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#cyberTeal)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#electricBlue)" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#metallicGold)" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="24 6" />

  <!-- Orbit Nodes -->
  <circle cx="256" cy="61" r="5" fill="#2dd4bf" filter="url(#neonGlow)" />
  <circle cx="451" cy="256" r="5" fill="#fbbf24" filter="url(#neonGlow)" />
  <circle cx="256" cy="451" r="5" fill="#00d2ff" filter="url(#neonGlow)" />
  <circle cx="61" cy="256" r="5" fill="#2dd4bf" filter="url(#neonGlow)" />

  <!-- ============================================
       CENTRAL MONOGRAM: "AV" EMBLEM
       Interlocking Ascending 'A' and Dynamic 'V'
       ============================================ -->
  <g filter="url(#neonGlow)" id="monogram">
    <!-- Left Wing of 'A' (Electric Blue) -->
    <path d="M 256 100 L 155 315 L 188 315 L 256 168 L 324 315 L 357 315 Z" 
          fill="url(#electricBlue)" 
          opacity="0.95" />

    <!-- Crossbar of 'A' / Wing Interlock (Cyber Teal) -->
    <polygon points="182,275 330,275 315,248 197,248" 
             fill="url(#cyberTeal)" />

    <!-- Dynamic 'V' Chevron (Metallic Gold) -->
    <path d="M 125 185 L 256 405 L 387 185 L 348 185 L 256 345 L 164 185 Z" 
          fill="url(#metallicGold)" />

    <!-- Inner Golden Core Diamond (Crown of Mahadev Energy) -->
    <polygon points="256,128 274,168 256,208 238,168" 
             fill="url(#metallicGold)" 
             filter="url(#neonGlow)" />

    <!-- Central Cyber Spark -->
    <circle cx="256" cy="168" r="4.5" fill="#ffffff" />

    <!-- Bottom Anchor Jewel (Teal) -->
    <polygon points="256,365 268,382 256,400 244,382" 
             fill="url(#cyberTeal)" />
  </g>

  <!-- Typography Brand Base -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="'Space Grotesk', 'Cinzel', -apple-system, sans-serif" 
        font-size="22" 
        font-weight="800" 
        letter-spacing="9" 
        fill="url(#goldToTeal)">
    AAYUVENKE🔱
  </text>
  <text x="256" y="468" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="9" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#94a3b8" 
        opacity="0.8">
    AI • CYBER • WEBGL
  </text>
</svg>
